<title>DistriPan & Dulce</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cream:#FFF6EA;--paper:#FFFDF9;--ink:#3A2416;--ink2:#5A3A24;--mut:#927B67;--line:#F0E3D0;
--terra:#C8553D;--terra2:#9E3B27;--crust:#E39B2D;--honey:#F6C552;--leaf:#4E8B3A;--sky:#2F6EA5;--berry:#C2456E;
--okbg:#E5F3E0;--ok:#3C7A2C;--warnbg:#FFF0D2;--warn:#A86A0E;--badbg:#FDE5E1;--bad:#B3321E;--infobg:#E2EEF9;--info:#2F6EA5;
--sh:0 8px 22px rgba(90,58,36,.10);--r:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#EADCC8;font-family:'Nunito Sans',system-ui,sans-serif;color:var(--ink);font-size:16px}
.phone{max-width:460px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom));box-shadow:0 0 50px rgba(60,40,20,.18);overflow-x:hidden}
.serif{font-family:'Fraunces',Georgia,serif}
/* header */
header{position:relative;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 26px;background:linear-gradient(140deg,#B8462F 0%,#D9693A 45%,#EFA23A 100%);border-radius:0 0 30px 30px;overflow:hidden;z-index:5}
header .deco{position:absolute;inset:0;pointer-events:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:46px;height:46px;border-radius:15px;background:#FFF6EA;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.brand b{display:block;font-family:'Fraunces',serif;font-weight:800;font-size:21px;line-height:1.05;letter-spacing:-.3px}
.brand small{display:block;font-size:12px;font-weight:700;opacity:.9;margin-top:2px}
.demo{font-size:10px;font-weight:900;letter-spacing:.6px;background:rgba(58,36,22,.25);padding:5px 9px;border-radius:99px}
.roles{display:flex;gap:8px;margin-top:16px;overflow-x:auto;scrollbar-width:none;position:relative}
.roles button{flex:1;min-width:max-content;border:0;border-radius:16px;padding:8px 10px;font:800 13px 'Nunito Sans';background:rgba(255,255,255,.18);color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center;transition:.2s}
.roles button .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:rgba(255,255,255,.25)}
.roles button.on{background:#fff;color:var(--terra2);box-shadow:0 6px 14px rgba(0,0,0,.15);transform:translateY(-1px)}
.roles button.on .av{background:var(--cream)}
main{padding:18px 16px 16px;position:relative}
h2{font-family:'Fraunces',serif;font-size:25px;font-weight:800;margin:2px 0 12px;letter-spacing:-.3px}
h3{font-size:13px;font-weight:900;margin:22px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:8px}
h3:after{content:'';flex:1;height:2px;background:var(--line);border-radius:2px}
.card{background:var(--paper);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh);animation:up .45s both}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--mut);font-size:13px}.b{font-weight:800}.big{font-size:23px;font-weight:900;letter-spacing:-.3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes slide{from{transform:translate(-50%,120%)}to{transform:translate(-50%,0)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* buttons */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:900 16px 'Nunito Sans';background:linear-gradient(135deg,var(--terra),#DE7B3A);color:#fff;cursor:pointer;text-align:center;box-shadow:0 8px 18px rgba(200,85,61,.3);transition:transform .12s}
.btn:active{transform:scale(.97)}.btn.sec{background:#fff;color:var(--terra2);border:2px solid var(--terra);box-shadow:none}.btn.ok{background:linear-gradient(135deg,#3C7A2C,#5FA046);box-shadow:0 8px 18px rgba(60,122,44,.3)}
.btn.sm{display:inline-block;width:auto;padding:9px 15px;font-size:14px;border-radius:12px;box-shadow:none}
/* action tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:22px;padding:16px 14px;text-align:left;font-family:inherit;cursor:pointer;color:#fff;position:relative;overflow:hidden;min-height:118px;box-shadow:var(--sh);animation:up .45s both;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .em{font-size:34px;display:block;margin-bottom:8px;animation:floaty 3s ease-in-out infinite}
.tile b{display:block;font-size:16px;font-weight:900}.tile span{font-size:12px;opacity:.9;font-weight:700}
.tile:after{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14);right:-24px;top:-24px}
.t1{background:linear-gradient(140deg,#C8553D,#E8834A)}.t2{background:linear-gradient(140deg,#2F6EA5,#4C9AD6)}.t3{background:linear-gradient(140deg,#3C7A2C,#6BAE4C)}.t4{background:linear-gradient(140deg,#D58A12,#F2BB45)}
/* hero */
.hero{border-radius:24px;padding:18px;background:linear-gradient(135deg,#3A2416,#6A4227);color:#fff;display:flex;gap:16px;align-items:center;box-shadow:var(--sh);margin-bottom:14px;position:relative;overflow:hidden;animation:up .4s both}
.hero .lbl{font-size:12px;font-weight:800;opacity:.75;text-transform:uppercase;letter-spacing:.6px}
.hero .val{font-family:'Fraunces',serif;font-size:28px;font-weight:800;margin:2px 0}
.ring{flex:none}
/* route banner */
.route{border-radius:24px;overflow:hidden;box-shadow:var(--sh);margin-bottom:14px;animation:up .4s both;position:relative}
.route .txt{position:absolute;left:16px;top:14px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.route .txt b{font-family:'Fraunces',serif;font-size:20px;display:block}.route .txt span{font-size:12px;font-weight:800}
/* search + chips */
.search{position:relative;margin-bottom:4px}
.search input{padding-left:44px}
.search .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px}
input,select,textarea{width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);font:700 16px 'Nunito Sans';background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--crust)}
label{font-size:13px;font-weight:800;color:var(--mut);display:block;margin:14px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chip{border:0;background:#fff;border-radius:18px;padding:6px 12px 6px 6px;font:800 13px 'Nunito Sans';white-space:nowrap;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(90,58,36,.08);transition:.2s}
.chip .ci{width:30px;height:30px;border-radius:11px;display:grid;place-items:center;overflow:hidden}
.chip .ci svg{width:28px;height:22px}
.chip.on{background:var(--ink);color:#fff;transform:translateY(-1px)}
.chip.txt{padding:8px 14px}
/* product grid */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:var(--sh);position:relative;animation:up .4s both;display:flex;flex-direction:column}
.pc .art{height:118px;display:grid;place-items:center;position:relative}
.pc .art svg{width:88%;height:96%}.pc .art img{width:100%;height:100%;object-fit:cover}
.pc .tag{position:absolute;left:8px;top:8px;font-size:10px;font-weight:900;background:rgba(255,255,255,.9);color:var(--ink2);padding:4px 8px;border-radius:99px;letter-spacing:.3px}
.pc .low{position:absolute;right:8px;top:8px;font-size:10px;font-weight:900;background:var(--bad);color:#fff;padding:4px 8px;border-radius:99px}
.pc .info{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.pc .nm{font-size:13px;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px;text-transform:capitalize}
.pc .pr{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.pc .pr b{font-size:17px;font-weight:900;color:var(--terra2)}
.addb{width:38px;height:38px;border-radius:13px;border:0;background:var(--terra);color:#fff;font:900 22px 'Nunito Sans';cursor:pointer;box-shadow:0 5px 12px rgba(200,85,61,.35);line-height:1}
.step{display:flex;align-items:center;gap:2px;background:var(--ink);border-radius:13px;padding:3px}
.step button{width:30px;height:30px;border-radius:10px;border:0;background:transparent;color:#fff;font:900 18px 'Nunito Sans';cursor:pointer}
.step output{min-width:22px;text-align:center;color:#fff;font-weight:900;animation:pop .25s}
.pc.inc{outline:3px solid var(--crust)}
/* list rows */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.li:last-child{border:0}
.th{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;flex:none;overflow:hidden}
.th svg{width:46px;height:38px}.th img{width:100%;height:100%;object-fit:cover}
.li .pn{flex:1;min-width:0}.li .pn b{display:block;font-size:14px;line-height:1.25;text-transform:capitalize}.li .pn span{font-size:12px;color:var(--mut);font-weight:700}
.av2{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-weight:900;color:#fff;flex:none;font-size:15px}
/* badges */
.badge{display:inline-block;font-size:12px;font-weight:900;padding:5px 10px;border-radius:99px;white-space:nowrap}
.b-pend{background:var(--warnbg);color:var(--warn)}.b-ok{background:var(--okbg);color:var(--ok)}.b-info{background:var(--infobg);color:var(--info)}.b-bad{background:var(--badbg);color:var(--bad)}.b-mut{background:#F1E8DC;color:var(--mut)}
/* order stepper */
.track{display:flex;align-items:center;margin:10px 0 4px}
.track .d{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:900;flex:none;transition:.3s}
.track .d.on{background:var(--leaf)}.track .d.cur{background:var(--crust);box-shadow:0 0 0 5px rgba(227,155,45,.25)}
.track .ln{flex:1;height:4px;background:var(--line);border-radius:4px}.track .ln.on{background:var(--leaf)}
.tlab{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:var(--mut)}
/* cart bar */
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:calc(min(460px,100%) - 24px);z-index:30;background:var(--ink);color:#fff;border-radius:22px;padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 28px rgba(0,0,0,.3);animation:slide .35s cubic-bezier(.2,1.4,.4,1) both}
.cartbar .cnt{width:38px;height:38px;border-radius:13px;background:var(--honey);color:var(--ink);display:grid;place-items:center;font-weight:900;margin-right:10px;animation:pop .3s}
.cartbar button{background:linear-gradient(135deg,var(--terra),#E8834A);color:#fff;border:0;border-radius:15px;padding:12px 16px;font:900 15px 'Nunito Sans';cursor:pointer}
/* nav */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:rgba(255,253,249,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:25;border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(90,58,36,.08)}
nav.tabs button{flex:1;border:0;background:none;font:800 11px 'Nunito Sans';color:var(--mut);padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;border-radius:16px;transition:.2s}
nav.tabs button .i{font-size:22px;line-height:1;transition:.2s}
nav.tabs button.on{color:var(--terra2);background:#FBEADB}nav.tabs button.on .i{transform:translateY(-2px) scale(1.12)}
nav.tabs .dot{position:absolute;top:0;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(40,24,12,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes sup{from{transform:translateY(100%)}}
.sheet{background:var(--cream);width:min(460px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:sup .3s cubic-bezier(.2,1,.3,1)}
.grab{width:46px;height:5px;border-radius:9px;background:#DCCBB4;margin:0 auto 14px}
.ticket{background:#fff;border-radius:16px;padding:18px;font-size:13px;position:relative;box-shadow:var(--sh)}
.ticket .tl{display:flex;justify-content:space-between;gap:8px;padding:3px 0}.ticket hr{border:0;border-top:2px dashed #E4D3BC;margin:10px 0}
.note{background:var(--infobg);color:var(--info);border-radius:14px;padding:11px 13px;font-size:13px;font-weight:700;margin:10px 0}
.warnnote{background:var(--warnbg);color:#7A4E0E}
.toast{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 18px;border-radius:16px;font-weight:900;z-index:99;box-shadow:0 10px 24px rgba(0,0,0,.25);max-width:90%;display:flex;gap:8px;align-items:center;animation:up .3s both}
.toast:before{content:'✓';width:24px;height:24px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-weight:700}
.empty .e{font-size:42px;display:block;margin-bottom:6px}
.seg{display:flex;background:#F1E4D2;border-radius:16px;padding:4px;gap:4px;margin-bottom:14px}.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:12px;font:900 13px 'Nunito Sans';color:var(--mut);cursor:pointer;transition:.2s}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 8px rgba(90,58,36,.1)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#7DBB55);border-radius:9px;transition:width .6s}
.right{text-align:right}
.kpi{border-radius:22px;padding:15px;color:#fff;box-shadow:var(--sh);animation:up .45s both;position:relative;overflow:hidden}
.kpi .k{font-size:12px;font-weight:800;opacity:.9}.kpi .v{font-family:'Fraunces',serif;font-size:22px;font-weight:800;margin-top:4px}
.kpi .ke{position:absolute;right:10px;bottom:6px;font-size:30px;opacity:.35}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 10px}
.hs .pc{flex:none;width:150px}
.chart .cb{display:flex;align-items:center;gap:10px;margin:8px 0}
.chart .cb .lab{width:96px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart .cb .tr{flex:1;height:22px;background:var(--line);border-radius:8px;overflow:hidden}
.chart .cb .tr i{display:block;height:100%;border-radius:8px}
@media print{body *{visibility:hidden!important}#printarea,#printarea *{visibility:visible!important}#printarea{position:absolute;left:0;top:0;box-shadow:none!important}}
.chart .cb .vv{font-size:12px;font-weight:900;width:70px;text-align:right}

.toast.bad{background:#B3321E}.toast.bad:before{content:'!';background:#fff;color:#B3321E}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acts .btn{flex:1}.btn.okb{background:linear-gradient(135deg,#3C7A2C,#5FA046);color:#fff}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#B8462F 0%,#D9693A 45%,#EFA23A 100%)}
.lbox{background:var(--cream);border-radius:28px;padding:28px 22px;width:min(420px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:left}
.lbox h1{font-size:28px;margin:8px 0 2px}.big-mark{width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.big-mark svg{width:48px;height:48px}.spin{display:inline-block;animation:floaty 1s ease-in-out infinite}
.btn[disabled]{opacity:.55}

.fotoed{position:relative;cursor:pointer;outline:2px dashed #E39B2D;outline-offset:2px}.fotoed .cam{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.li .pn>span{display:block}
.tirilla{background:#fff;color:#000;width:300px;max-width:100%;margin:0 auto;padding:14px 12px;font:12.5px/1.45 'Courier New',monospace;border-radius:8px;box-shadow:var(--sh)}
.tirilla img{display:block;width:78%;margin:0 auto 4px}.tirilla .c{text-align:center}.tirilla hr{border:0;border-top:1px dashed #000;margin:6px 0}
.tirilla .tl{display:flex;justify-content:space-between;gap:8px}.tirilla .tot{font-size:16px;font-weight:900;margin:4px 0}
@media print{@page{size:80mm auto;margin:2mm}body{background:#fff!important}body *{visibility:hidden!important}#printarea,#printarea *{visibility:visible!important}
#printarea{position:absolute;left:0;top:0;width:76mm;box-shadow:none;border-radius:0;padding:0}.sheet-bg{background:none!important}}
/* Categorías en cuadrícula: todas visibles, fáciles de tocar */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 14px}
.cat{border:2px solid transparent;background:#fff;border-radius:16px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:800 11px/1.15 'Nunito Sans',sans-serif;color:var(--ink);box-shadow:0 3px 10px rgba(90,58,36,.08);min-height:78px;transition:.15s}
.cat .ci{width:42px;height:34px;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.cat .ci svg{width:40px;height:32px}
.cat span:last-child{text-align:center;word-break:break-word}
.cat.on{border-color:#D9486A;background:#FCE4EA;color:#A8324F}
.cat:active{transform:scale(.95)}
@media (max-width:360px){.cats{grid-template-columns:repeat(3,1fr)}}
/* Las demás filas de botones (listas de precios) también bajan de renglón */
.chips{flex-wrap:wrap;overflow:visible;margin-left:0;margin-right:0;padding-left:0;padding-right:0}
/* Fotos reales: se ven completas, sin cortar */
.pc .art img{object-fit:contain;background:#fff}
.th img{object-fit:contain;background:#fff}

header{background:linear-gradient(140deg,#2E1C12 0%,#3F2719 55%,#5A3820 100%)}
.brand .mark{background:transparent;box-shadow:0 4px 12px rgba(0,0,0,.35);overflow:hidden;width:48px;height:48px;border-radius:14px}
.brand .mark img{width:100%;height:100%;display:block}
.bname{font-family:'Fredoka',system-ui,sans-serif!important;font-weight:700!important;font-size:22px!important;letter-spacing:0!important;color:#FFF3E6}
.btn{background:linear-gradient(135deg,#D9486A,#E8708C);box-shadow:0 8px 18px rgba(217,72,106,.28)}
.btn.sec{background:#fff;color:#A8324F;border-color:#D9486A}
.addb{background:#D9486A;box-shadow:0 5px 12px rgba(217,72,106,.35)}
.cartbar{background:#2E1C12}.cartbar button{background:linear-gradient(135deg,#D9486A,#E8708C)}
.cartbar .cnt{background:#F2B544}
.login{background:linear-gradient(150deg,#2E1C12 0%,#4A2E1E 60%,#6A4227 100%)}
nav.tabs button.on{color:#A8324F;background:#FCE4EA}
.pc .pr b{color:#2E1C12}
.hero{background:linear-gradient(135deg,#2E1C12,#5A3820)}
.chip.on{background:#2E1C12}

function achicar(file) {
  // Recorta el fondo blanco sobrante, centra el producto y lo deja en un cuadro de 800 × 800
  return new Promise((res, rej) => { const img = new Image();
    img.onload = () => {
      const W = img.naturalWidth, H = img.naturalHeight, k = Math.min(1, 1200 / Math.max(W, H));
      const a = document.createElement('canvas'); a.width = Math.round(W * k); a.height = Math.round(H * k);
      const ax = a.getContext('2d'); ax.fillStyle = '#fff'; ax.fillRect(0, 0, a.width, a.height); ax.drawImage(img, 0, 0, a.width, a.height);
      let x0 = a.width, y0 = a.height, x1 = -1, y1 = -1;
      try {
        const d = ax.getImageData(0, 0, a.width, a.height).data;
        for (let y = 0; y < a.height; y += 2) for (let x = 0; x < a.width; x += 2) {
          const i = (y * a.width + x) * 4;
          if (d[i] < 235 || d[i + 1] < 235 || d[i + 2] < 235) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        }
      } catch (e) {}
      if (x1 < 0 || (x1 - x0) < 20 || (y1 - y0) < 20) { x0 = 0; y0 = 0; x1 = a.width - 1; y1 = a.height - 1; }
      const w = x1 - x0 + 1, h = y1 - y0 + 1, lado = Math.round(Math.max(w, h) * 1.08), S = 800, e = S / lado;
      const c = document.createElement('canvas'); c.width = S; c.height = S;
      const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, S, S);
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(a, x0, y0, w, h, (S - w * e) / 2, (S - h * e) / 2, w * e, h * e);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? res(b) : rej(new Error('No se pudo leer la imagen')), 'image/jpeg', 0.85);
    };
    img.onerror = () => rej(new Error('Ese archivo no es una imagen (usa JPG o PNG)')); img.src = URL.createObjectURL(file); });
}
async function subirFoto(pid, input) {
  const f = input.files && input.files[0]; if (!f) return;
  toast('Subiendo foto…');

    const up = await sb.storage.from('productos').upload(path, blob, { contentType: 'image/jpeg', upsert: true });

    if (old) sb.storage.from('productos').remove([old]);

}

  ${L('Cliente:', esc(t.cliente ? t.cliente.nombre : 'Consumidor final'))}${t.cliente && t.cliente.doc ? L('Documento:', esc(t.cliente.doc)) : ''}${L('Vendedor:', esc(t.vendedor))}<hr>
  ${t.lineas.map(l => `<div>${esc(l.nombre)}</div>${L(`&nbsp;&nbsp;${l.n} x ${fmt(l.precio)}`, fmt(l.n * l.precio))}`).join('')}<hr>
  ${t.desc ? L('Descuento aplicado:', t.desc + '%') : ''}<div class="tl tot"><span>TOTAL</span><span>${fmt(t.total)}</span></div>
  ${L('Pago:', esc(MEDIO_N[t.medio] || t.medio))}<hr>
  <div class="c">${t.modalidad === 'factura' ? 'La factura electrónica se enviará<br>a su correo.' : ''}<br><b>Este comprobante no es factura electrónica.</b><br><br>¡Gracias por su compra!</div></div>`;
}
function verTicket(id) {
  const t = (C.tk || {})[id]; if (!t) return;
  const txt = `${BRAND}\nComprobante de venta ${t.numero ? 'V-' + t.numero : '(pendiente)'}\n${new Date(t.fecha).toLocaleString('es-CO')}\nCliente: ${t.cliente ? t.cliente.nombre : 'Consumidor final'}\n` +
    t.lineas.map(l => `${l.n} x ${nice(l.nombre)}: ${fmt(l.n * l.precio)}`).join('\n') + `\nTOTAL: ${fmt(t.total)}\nPago: ${MEDIO_N[t.medio] || t.medio}\n(No es factura electrónica)`;
  sheet(`${ticketHTML(t)}<div class="grid2" style="margin-top:14px"><button class="btn" onclick="imprimir()">🖨️ Imprimir</button><a class="btn sec" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">📲 WhatsApp</a></div>
  <div style="height:10px"></div><button class="btn sec" onclick="closeSheet();${tab === 'contado' ? 'refresh()' : ''}">${tab === 'contado' ? '＋ Nueva venta' : 'Cerrar'}</button>`);
}
function imprimir() { try { window.print(); } catch (e) { toast('No se pudo abrir la impresión', true); } }
async function vistaVentas() {
  const vs = await q(sb.from('ventas').select('id,numero,fecha,modalidad,medio_pago,estado,clientes(razon_social),vendedor:perfiles!ventas_vendedor_id_fkey(nombre),venta_items(producto_id,cantidad,precio_unitario)').order('numero', { ascending: false }).limit(80));
  const tot = v => v.venta_items.reduce((a, i) => a + i.cantidad * i.precio_unitario, 0), hoy = new Date().toDateString();
  const vh = vs.filter(v => new Date(v.fecha).toDateString() === hoy);
  return `<div class="row"><h2>Pedidos</h2><button class="btn sm sec" onclick="refresh()">↻</button></div>
  <div class="seg">${[['enviado','Por aprobar'],['proceso','En proceso'],['todos','Todos'],['ventas','Contado']].map(([k, n]) => `<button class="${sub.ap === k ? 'on' : ''}" onclick="sub.ap='${k}';refresh()">${n}</button>`).join('')}</div>
  <div class="grid2"><div class="kpi" style="background:linear-gradient(135deg,#3C7A2C,#6BAE4C)"><div class="k">Contado hoy</div><div class="v">${fmt(vh.reduce((a, v) => a + tot(v), 0))}</div><span class="ke">💵</span></div>
  <div class="kpi" style="background:linear-gradient(135deg,#2F6EA5,#4C9AD6)"><div class="k">Por facturar</div><div class="v">${vs.filter(v => v.modalidad === 'factura' && v.estado === 'registrada').length}</div><span class="ke">📄</span></div></div>
  <div style="height:12px"></div>${vs.map((v, i) => `<div class="card" ${dl(i)}><div class="row"><b class="serif" style="font-size:17px">Venta V-${v.numero}</b><span class="badge ${v.modalidad === 'factura' ? 'b-info' : 'b-ok'}">${v.modalidad === 'factura' ? (v.estado === 'facturada' ? 'Facturada' : 'Por facturar') : 'Tirilla'}</span></div>
   <div class="mut">${fdate(v.fecha)} ${new Date(v.fecha).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })} · ${esc(v.clientes?.razon_social || 'Consumidor final')} · ${esc(v.vendedor?.nombre || '')} · ${esc(MEDIO_N[v.medio_pago] || v.medio_pago || '')}</div>
   ${thumbs({ pedido_items: v.venta_items })}<div class="big" style="font-size:20px;margin-top:6px">${fmt(tot(v))}</div></div>`).join('') || '<div class="empty"><span class="e">💵</span>Aún no hay ventas de contado</div>'}`;
}
// service worker: la app abre aunque no haya señal
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

V.proximo = async () => `<h2>${ROLE === 'cartera' ? 'Cartera' : 'Rutas'}</h2><div class="empty"><span class="e">🛠️</span>Este módulo llega en la ${ROLE === 'cartera' ? 'Fase 8 (cartera y recaudo)' : 'Fase 9 (logística)'}.</div>`;

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') showLogin(); });
boot();

</script>
</body>
</html>
